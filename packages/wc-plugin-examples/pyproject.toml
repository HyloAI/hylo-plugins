[project]
name = "wc-plugin-examples"
version = "0.1.0.dev0"
description = "Example third-party plugins for worldcurrent: one per extension point, each with a test and a config"
requires-python = ">=3.10"
dependencies = ["wc-core", "wc-eval", "wc-learn", "wc-agents", "numpy>=1.24"]
license = "Apache-2.0"

[project.entry-points."worldcurrent.learners"]
"examples.cem" = "wc_examples.online:CEMLearner"

[project.entry-points."worldcurrent.gate_tests"]
"examples.min_effect" = "wc_examples.stats:MinEffectMcNemar"

[project.entry-points."worldcurrent.policies"]
"examples.ik_reacher" = "wc_examples.policies:IKReacherPolicy"
"examples.mixture" = "wc_examples.policies:MixturePolicy"

[project.entry-points."worldcurrent.guards"]
"examples.slow_zone" = "wc_examples.guards:SlowZoneGuard"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wc_examples"]

[tool.uv.sources]
wc-core = { workspace = true }
wc-eval = { workspace = true }
wc-learn = { workspace = true }
wc-agents = { workspace = true }

[project.entry-points."worldcurrent.meta"]
"wc-plugin-examples" = "wc_examples:META"
