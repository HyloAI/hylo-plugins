# A mixture of two policies, steered: each of 4 seeded samples comes from one member (examples.mixture), and the
# medoid proposal is executed. Members can be any registered policies (reference policies, LeRobot, your own).
schema_version: wc.experiment/v0.1
name: mujoco-mixture
benchmark: {type: mujoco/reach-v0, split: validation}
env: {type: mujoco.planar_reach}
agent:
  type: steered
  params:
    sampler:
      type: examples.mixture
      params:
        members:
          - {type: examples.ik_reacher, params: {gain: 0.3, noise: 0.05}}
          - {type: examples.ik_reacher, params: {gain: 0.1, noise: 0.3}}
        weights: [0.5, 0.5]
    steering: {n_samples: 4, selector: medoid}
workers: 8
output_dir: runs
